# https://pre-commit.com
default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push
# Hooks without explicit `stages` run on pre-commit only (not again on commit-msg/pre-push)
default_stages: [pre-commit]
repos:
  # ---------------------------------------------------------------------------
  # General file hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: debug-statements # Check for debugger imports and breakpoint() in python files
      - id: check-ast # Simply check whether files parse as valid python
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer # Makes sure files end in a newline and only a newline
        stages: [pre-commit] # upstream manifest also opts into pre-push, overriding default_stages
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-merge-conflict
      - id: check-case-conflict # Check for filenames that would conflict on a case-insensitive filesystem
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
  # ---------------------------------------------------------------------------
  # Python lint & format
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        types_or: [python, pyi, jupyter]
  # ---------------------------------------------------------------------------
  # Docs: Python snippets in documentation
  # ---------------------------------------------------------------------------
  - repo: https://github.com/asottile/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black]
  # ---------------------------------------------------------------------------
  # Type checking (pre-push)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --group lint ty check . --ignore unresolved-import
        language: system
        pass_filenames: false
        stages:
          - "pre-push"
          - "pre-merge-commit"
  # ---------------------------------------------------------------------------
  # Tests (pre-push)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        language: system
        types: [python]
        entry: env ENVIRONMENT=test uv run --group test pytest
        pass_filenames: false
        always_run: false
        args: [--doctest-modules]
        stages: [pre-push]
  # ---------------------------------------------------------------------------
  # Notebooks
  # ---------------------------------------------------------------------------
  - repo: https://github.com/roy-ht/pre-commit-jupyter
    rev: v1.2.1
    hooks:
      - id: jupyter-notebook-cleanup
        args:
          - --remove-kernel-metadata
          - --pin-patterns
          - "[pin];[donotremove]"
  # ---------------------------------------------------------------------------
  # GitHub Actions workflows
  # ---------------------------------------------------------------------------
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  # ---------------------------------------------------------------------------
  # Shell scripts
  # ---------------------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
  # ---------------------------------------------------------------------------
  # Markdown
  # ---------------------------------------------------------------------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: ['--disable', 'MD007', 'MD013', 'MD022', 'MD032', 'MD033', 'MD041', '--']
        exclude: ^CHANGELOG\.md$
  # ---------------------------------------------------------------------------
  # Docs: self-healing checks (markdown drift vs. reality)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/MarekWadinger/doc-checks
    rev: v0.5.1
    hooks:
      # doc-checks requires Python >=3.13; pin so pre-commit builds the isolated
      # env with a compatible interpreter regardless of the project's own floor.
      - id: doc-check-make-refs # stale `make <target>` refs in markdown
        language_version: python3.13
      - id: doc-check-cd-refs # `cd <path>` pointing at missing dirs
        language_version: python3.13
      - id: doc-check-py-imports # stale project-local imports in fences
        language_version: python3.13
      - id: doc-check-trees # stale paths in ASCII project-trees
        language_version: python3.13
      - id: doc-check-mermaid # broken mermaid syntax (needs mmdc, else skipped)
        language_version: python3.13
  # ---------------------------------------------------------------------------
  # Commit message
  # ---------------------------------------------------------------------------
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.2
    hooks:
      - id: commitizen
        stages: [commit-msg]
  # ---------------------------------------------------------------------------
  # Lockfile sync
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.3
    hooks:
      - id: uv-sync
        args: [--frozen]
        # Upstream defaults to post-checkout/merge/rewrite stages, which are no
        # longer installed by default_install_hook_types; run on pre-commit too.
        stages: [pre-commit, post-checkout, post-merge, post-rewrite]
