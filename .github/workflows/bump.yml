name: Bump & Release
on:
  push:
    branches: [main]
jobs:
  bump:
    runs-on: ubuntu-latest
    # Skip the commit the bump itself creates, and skip if nothing bumpable landed.
    if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.cz.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # commitizen needs full history + tags to compute the bump
      # A fresh "Use this template" copy still carries the template's own
      # version until `make init` runs; bumping then would tag template state.
      # init deletes the README template-usage section, so its marker is a
      # reliable initialized/uninitialized signal that init's sed never touches.
      - name: Skip on uninitialized template copies
        id: guard
        run: |
          if grep -q 'TEMPLATE_USAGE_START' README.md && [ "$GITHUB_REPOSITORY" != "MarekWadinger/python-app-template" ]; then
            echo "initialized=false" >> "$GITHUB_OUTPUT"
            echo "Uninitialized template copy — skipping bump."
          else
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump version, update CHANGELOG.md, create tag
        id: cz
        if: ${{ steps.guard.outputs.initialized == 'true' }}
        uses: commitizen-tools/commitizen-action@0.24.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changelog_increment_filename: release-body.md
      - name: Create GitHub release
        if: ${{ steps.guard.outputs.initialized == 'true' && steps.cz.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.cz.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — skipping."
          else
            gh release create "$tag" --title "$tag" --notes-file release-body.md
          fi

  # Publish to PyPI via trusted publishing. Runs in the same workflow as the
  # bump because tags pushed with GITHUB_TOKEN do not trigger other workflows.
  #
  # Opt-in: set the repository variable ENABLE_PYPI_PUBLISH to "true" and
  # configure a trusted publisher on PyPI for this repo (workflow: bump.yml,
  # environment: pypi). Until then this job is skipped.
  publish:
    runs-on: ubuntu-latest
    needs: bump
    if: ${{ needs.bump.outputs.version != '' && vars.ENABLE_PYPI_PUBLISH == 'true' }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}
      - uses: astral-sh/setup-uv@v5
      - name: Build package
        run: uv build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
