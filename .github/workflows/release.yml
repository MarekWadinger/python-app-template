# Publishes to PyPI via trusted publishing — no API token needed.
#
# Template users: configure a PyPI trusted publisher first.
# On pypi.org → your project → Publishing → add a GitHub publisher with:
#   - repository: your GitHub repo (owner/name)
#   - workflow: release.yml
#   - environment: pypi
# Then create a matching "pypi" environment in your repo settings.
#
# Tags are pushed by bump.yml (commitizen), which also creates the GitHub release.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
