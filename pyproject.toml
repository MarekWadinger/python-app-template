[project]
name = "python-project-template"
version = "0.6.0"
description = "A comprehensive Python project template with pre-commit, CI/CD, and automated setup"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Marek Wadinger", email = "marekwadinger5506@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_app_template"]

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "pre-commit>=4.0",
]
lint = [
    "deptry>=0.25.1",
    "ty>=0.0.95",
]
test = [
    "hypothesis>=6.170.15",
    "inline-snapshot>=0.37.0",
    "pytest>=9.2.0",
    "pytest-cov>=4.0.0",
]
security = [
    "pip-audit>=2.7.0",
]
format = [
    "ruff>=0.17.3",
]

[project.urls]
Homepage = "https://github.com/MarekWadinger/python-app-template"
Repository = "https://github.com/MarekWadinger/python-app-template"
Documentation = "https://github.com/MarekWadinger/python-app-template#readme"
"Bug Tracker" = "https://github.com/MarekWadinger/python-app-template/issues"

[tool.uv]
# uv sync, the uv-sync hook and plain uv run all install every group, so no command needs --group
default-groups = "all"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
changelog_file = "CHANGELOG.md"
version_files = ["src/python_app_template/__init__.py:__version__"]
update_changelog_on_bump = true
major_version_zero = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PIE", "PERF", "FURB", "RUF",
    "PL", "PTH", "DTZ", "S", "BLE", "TRY", "ARG", "ERA", "ANN", "FBT", "TC", "T20", "TD",
]
ignore = [
    "TRY003",  # an exception's message says what to do next, so it is long on purpose
    "RUF001", "RUF002", "RUF003",  # typographic characters (› – …) in text are deliberate
]

[tool.ruff.lint.pylint]
max-positional-args = 3  # past 3, parameters are keyword-only so callers can't swap them

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN", "ARG", "FBT", "PLC0415", "PLR2004", "S101"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.inline-snapshot]
# A plain pytest run only reports snapshot changes; write them with --inline-snapshot=create or =fix
default-flags = ["report"]
default-flags-tui = ["report"]
format-command = "ruff format --stdin-filename {filename}"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.deptry]
# src layout: deptry only finds local packages at the root, so name ours
known_first_party = ["python_app_template"]
